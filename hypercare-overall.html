<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>1K-5K Hypercare - Overall Metrics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg-canvas:#f4f6f4;
  --surface:#ffffff;
  --surface-2:#eef1ef;
  --border:#dde3e0;
  --ink-1:#161b19;
  --ink-2:#4c5854;
  --ink-3:#828e8a;
  --accent:#0f6d5c;
  --accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-canvas:#0e1210;
    --surface:#171c1a;
    --surface-2:#1e2422;
    --border:#2b322f;
    --ink-1:#f2f5f3;
    --ink-2:#bcc7c2;
    --ink-3:#7d8985;
    --accent:#3fb69a;
    --accent-ink:#08110d;
  }
}
:root[data-theme="dark"]{
  --bg-canvas:#0e1210;
  --surface:#171c1a;
  --surface-2:#1e2422;
  --border:#2b322f;
  --ink-1:#f2f5f3;
  --ink-2:#bcc7c2;
  --ink-3:#7d8985;
  --accent:#3fb69a;
  --accent-ink:#08110d;
}

*{box-sizing:border-box;}
body{background:var(--bg-canvas); color:var(--ink-1); font-family:'IBM Plex Sans',system-ui,sans-serif;}
.wrap{max-width:1200px; margin:0 auto; padding:6px 24px 72px;}

h1{font-family:'Sora',system-ui,sans-serif; font-weight:700; font-size:clamp(1.5rem,2.4vw,2.05rem); letter-spacing:-0.01em; margin:0 0 18px; text-wrap:balance;}

.metric-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:16px;}
.metric-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px 24px;}
.metric-label{font-family:'IBM Plex Sans',sans-serif; font-size:0.78rem; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:8px;}
.metric-count{font-family:'Sora',system-ui,sans-serif; font-weight:700; font-size:2.3rem; color:var(--ink-1); line-height:1;}
.metric-count-suffix{font-family:'IBM Plex Sans',sans-serif; font-weight:500; font-size:0.9rem; color:var(--ink-3); margin-left:6px;}
.metric-gls{font-family:'IBM Plex Sans',sans-serif; font-size:0.72rem; color:var(--ink-3); margin-top:6px; line-height:1.5;}
.metric-sub{margin-top:16px; padding-top:14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:7px;}
.metric-sub-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.metric-sub-row .k{font-family:'IBM Plex Sans',sans-serif; font-size:0.8rem; color:var(--ink-2);}
.metric-sub-row .v{font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--ink-3);}
</style>
<div class="wrap">
  <h1>1K-5K Hypercare &mdash; Overall Metrics</h1>

  <div class="metric-grid" id="metricGrid"></div>
</div>
<script src="sellers-data-1.js"></script>
<script src="sellers-data-2.js"></script>
<script src="sellers-data-3.js"></script>
<script>
// ---- Full per-seller data, same source files as hypercare-sellers.html, kept in
// sync with every weekly refresh. Only the fields needed for bucket metrics are
// read here (gl_name, revival_tag, pnl_tag, yesterday_spend, yesterday_arr). ----
const ALL_SELLERS = [...SELLERS_DATA_1, ...SELLERS_DATA_2, ...SELLERS_DATA_3];

// ---- GL -> bucket mapping. Edit the `gls` lists freely (names must match the
// gl_name values in the data above exactly); a GL not listed in any bucket just
// doesn't count toward one. Card 1 (total) always counts every seller regardless
// of this mapping. ----
const GL_BUCKETS = [
  {
    key: 'pause21',
    label: '21 days pause bucket',
    gls: ['Piyush Dubey', 'Sachin Srivastava'],
    metrics: ['Revived', 'Spend/Revived', 'Spending', 'In Pipeline', 'BH%', 'Potential%', 'Bucket ARR'],
  },
  {
    key: 'nonscaling',
    label: 'Non-scaling bucket',
    gls: ['Rayala Bhanu Sriraj'],
    metrics: ['Spend/Live', 'BH%', 'Potential%', 'Bucket ARR'],
  },
  {
    key: 'loss',
    label: 'Loss accounts bucket',
    gls: ['Sandhya Narwade'],
    metrics: ['Spend/Live', 'BH%', 'Potential%', 'Bucket ARR'],
  },
];

// ---- Same bucket-metric math as hypercare-sellers.html's GL-wise boxes, but
// pooled across every GL mapped to the bucket (not scoped to one active GL chip,
// and not averaged per-GL) -- e.g. pause21's Revived count is Piyush Dubey's and
// Sachin Srivastava's Revived sellers added together. ----
function pct(n, d){
  if (!d) return '—';
  return (100 * n / d).toFixed(1) + '%';
}
function avg(nums){
  if (!nums.length) return '—';
  const v = nums.reduce((a,b) => a+b, 0) / nums.length;
  return Math.round(v).toLocaleString('en-IN');
}
function computeBucketMetrics(sellers, bucketKey){
  const revived = sellers.filter(r => r.revival_tag === 'Revived');
  const isBH = r => r.pnl_tag === 'Bucket Health' || r.pnl_tag === 'B.E. Bucket Health';
  const isPotential = r => r.pnl_tag === 'Potential';
  const denomBase = bucketKey === 'pause21' ? revived : sellers;
  const out = {};
  if (bucketKey === 'pause21'){
    out['Revived'] = String(revived.length);
    const spendRevived = revived.filter(r => Math.abs(Number(r.yesterday_spend) || 0) > 100);
    out['Spend/Revived'] = pct(spendRevived.length, revived.length);
    const spending = sellers.filter(r => (Number(r.yesterday_spend) || 0) > 10);
    out['Spending'] = String(spending.length);
    out['In Pipeline'] = 'TBD';
  } else {
    const live = sellers.filter(r => (Number(r.yesterday_spend) || 0) > 10);
    out['Spend/Live'] = pct(live.length, sellers.length);
  }
  out['BH%'] = pct(denomBase.filter(isBH).length, denomBase.length);
  out['Potential%'] = pct(denomBase.filter(isPotential).length, denomBase.length);
  const arrVals = denomBase.map(r => Number(r.yesterday_arr)).filter(v => !Number.isNaN(v) && v !== null);
  out['Bucket ARR'] = avg(arrVals);
  return out;
}

const grid = document.getElementById('metricGrid');

function makeCard({label, count, gls, metricValues, metricOrder}){
  const card = document.createElement('div');
  card.className = 'metric-card';

  const lbl = document.createElement('div');
  lbl.className = 'metric-label';
  lbl.textContent = label;
  card.appendChild(lbl);

  const countEl = document.createElement('div');
  countEl.className = 'metric-count';
  countEl.textContent = count;
  const suffix = document.createElement('span');
  suffix.className = 'metric-count-suffix';
  suffix.textContent = count === 1 ? 'seller' : 'sellers';
  countEl.appendChild(suffix);
  card.appendChild(countEl);

  if (gls && gls.length){
    const glsEl = document.createElement('div');
    glsEl.className = 'metric-gls';
    glsEl.textContent = 'GL' + (gls.length > 1 ? 's' : '') + ': ' + gls.join(', ');
    card.appendChild(glsEl);
  }

  if (metricOrder && metricOrder.length){
    const sub = document.createElement('div');
    sub.className = 'metric-sub';
    metricOrder.forEach(m => {
      const row = document.createElement('div');
      row.className = 'metric-sub-row';
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = m;
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = metricValues[m];
      row.appendChild(k);
      row.appendChild(v);
      sub.appendChild(row);
    });
    card.appendChild(sub);
  }

  return card;
}

grid.appendChild(makeCard({
  label: 'Total accounts in Hypercare',
  count: ALL_SELLERS.length,
}));

GL_BUCKETS.forEach(bucket => {
  const sellers = ALL_SELLERS.filter(r => bucket.gls.includes(r.gl_name));
  const metricValues = computeBucketMetrics(sellers, bucket.key);
  grid.appendChild(makeCard({
    label: bucket.label,
    count: sellers.length,
    gls: bucket.gls,
    metricValues,
    metricOrder: bucket.metrics,
  }));
});
</script>
</body></html>
